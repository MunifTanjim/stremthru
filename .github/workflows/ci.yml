name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
    paths-ignore:
      - sdk/**

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Dependencies
        run: go get .
      - name: Check Format
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Lint
        run: go vet
      - name: Build
        run: go build --tags "fts5" -v ./...
      - name: Test
        run: STREMTHRU_ENV=test go test --tags "fts5" -v ./...
      - name: Test Anime and Performance Flag Combinations
        run: |
          for flags in "" "+anime" "+performance" "+anime,+performance"; do
            echo "Testing STREMTHRU_FEATURE=${flags:-default}"
            STREMTHRU_ENV=test STREMTHRU_FEATURE="$flags" go test --tags "fts5" ./internal/config ./internal/matchlab ./internal/worker ./internal/torrent_info ./internal/torrent_stream ./internal/torznab ./internal/stremio/torz ./internal/torznab/indexer/syncinfo
          done
